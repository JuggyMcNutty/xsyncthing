name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: host build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++-14
      - name: Build and test
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/build-host.sh

  xsdk:
    name: console build (.xex)
    runs-on: ubuntu-24.04
    env:
      XSDK_TOOLCHAIN: /home/runner/xsdk-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev
          libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Toolchain cache key
        id: key
        # The toolchain only changes when xsdk's toolchain script or patches change.
        run: echo "hash=${{ hashFiles('third_party/xsdk/tools/toolchain/**') }}" >> "$GITHUB_OUTPUT"
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: ${{ env.XSDK_TOOLCHAIN }}
          key: xsdk-gcc-${{ runner.os }}-${{ steps.key.outputs.hash }}
      - name: Bootstrap (toolchain + libxsdk)
        run: scripts/bootstrap.sh
      - name: Build xsyncthing.xex
        run: scripts/build-xex.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xsyncthing-xex
          path: |
            build-xsdk/xsyncthing.xex
            build-xsdk/xst-console-test.xex
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, xsdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xsyncthing-xex
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xsyncthing.xex xst-console-test.xex --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
