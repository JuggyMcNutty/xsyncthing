name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: host build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++-14
      - name: Build and test
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/build-host.sh

  interop:
    name: interop with stock Syncthing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++-14
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: scripts/build-host.sh
      - name: Stock Syncthing
        run: echo "ST=$(tests/interop/get-syncthing.sh)" >> "$GITHUB_ENV"
      - name: Interop
        run: tests/interop/run.py --syncthing "$ST" --xsyncthing build-host/xsyncthing
      - name: Stock strelaysrv
        run: echo "RELAY=$(tests/interop/get-syncthing.sh --relay)" >> "$GITHUB_ENV"
      - name: Interop through a relay (both directions)
        run: |
          tests/interop/run.py --syncthing "$ST" --xsyncthing build-host/xsyncthing --relay "$RELAY" --work /tmp/xst-interop-relay
          tests/interop/run.py --syncthing "$ST" --xsyncthing build-host/xsyncthing --relay "$RELAY" --relay-inbound --work /tmp/xst-interop-relay-in
      - name: Interop (FATX rules)
        run: tests/interop/run.py --syncthing "$ST" --xsyncthing build-host/xsyncthing --fatx --work /tmp/xst-interop-fatx
      - name: REST API compared with stock Syncthing's, endpoint by endpoint
        run: tests/interop/api_compare.py --syncthing "$ST" --xsyncthing build-host/xsyncthing
      - name: REST API as the Web GUI uses it
        run: tests/interop/api_check.py --xsyncthing build-host/xsyncthing
      - name: Stock Web GUI in headless Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          tests/interop/gui_check.py --xsyncthing build-host/xsyncthing --screenshot /tmp/xst-gui.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webgui-screenshots
          path: /tmp/xst-gui*.png
          if-no-files-found: ignore
      - name: Logs
        if: failure()
        run: tail -n 100 /tmp/xst-interop*/a.log /tmp/xst-interop*/b.log

  xsdk:
    name: console build (.xex)
    runs-on: ubuntu-24.04
    env:
      XSDK_TOOLCHAIN: /home/runner/xsdk-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev
          libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Toolchain cache key
        id: key
        # The toolchain only changes when xsdk's toolchain script or patches change.
        run: echo "hash=${{ hashFiles('third_party/xsdk/tools/toolchain/**') }}" >> "$GITHUB_OUTPUT"
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: ${{ env.XSDK_TOOLCHAIN }}
          key: xsdk-gcc-${{ runner.os }}-${{ steps.key.outputs.hash }}
      - name: Bootstrap (toolchain + libxsdk)
        run: scripts/bootstrap.sh
      - name: Build xsyncthing.xex
        run: scripts/build-xex.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xsyncthing-xex
          path: |
            build-xsdk/xsyncthing.xex
            build-xsdk/xst-console-test.xex
            assets/cacert.pem
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, interop, xsdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xsyncthing-xex
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xsyncthing.xex xst-console-test.xex assets/cacert.pem --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
